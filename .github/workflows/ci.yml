name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: PastyCore tests & benchmarks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sqlite3 --version
      - name: Test
        run: swift test --package-path PastyCore 2>&1 | tee core-tests.log
      - name: Benchmarks
        if: always()
        run: grep '\[benchmark\]' core-tests.log || true

  app:
    name: Build Pasty.app (universal)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Import signing identity (if configured)
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/import-signing-identity.sh
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh
      - name: Verify bundle
        run: |
          APP=build/Release/Pasty.app
          lipo -archs "$APP/Contents/MacOS/Pasty"
          lipo -archs "$APP/Contents/MacOS/Pasty" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/Pasty" | grep -q x86_64
          plutil -p "$APP/Contents/Info.plist"
          ls -la "$APP/Contents/Resources"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
      - name: Smoke test (launch, capture, panel timing)
        run: scripts/smoke-test.sh build/Release/Pasty.app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Pasty-app
          path: |
            build/Pasty.zip
            build/Pasty.zip.sha256
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: build/smoke/

  release:
    name: Publish GitHub release
    needs: [core-tests, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pasty-app
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          cd dist
          sha256sum -c Pasty.zip.sha256
          {
            echo "Automatic build of ${GITHUB_SHA::7}. Installed copies update themselves in the background."
            echo
            echo "Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Pasty.zip -o /tmp/Pasty.zip && ditto -xk /tmp/Pasty.zip /Applications && open /Applications/Pasty.app\`"
          } > notes.md
          gh release create "$TAG" Pasty.zip Pasty.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pasty ${TAG#v}" --notes-file notes.md --latest
