name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: PastyCore tests & benchmarks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sqlite3 --version
      - name: Test
        run: swift test --package-path PastyCore 2>&1 | tee core-tests.log
      - name: Benchmarks
        if: always()
        run: grep '\[benchmark\]' core-tests.log || true

  app:
    name: Build Pasty.app (universal)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Import signing identity (if configured)
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/import-signing-identity.sh
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh
      - name: Verify bundle
        run: |
          APP=build/Release/Pasty.app
          lipo -archs "$APP/Contents/MacOS/Pasty"
          lipo -archs "$APP/Contents/MacOS/Pasty" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/Pasty" | grep -q x86_64
          plutil -p "$APP/Contents/Info.plist"
          ls -la "$APP/Contents/Resources"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
      - name: Smoke test (launch, capture, panel timing)
        run: scripts/smoke-test.sh build/Release/Pasty.app
      - name: Install script (fresh install, then update)
        run: |
          DEST="$(mktemp -d)"
          export PASTY_DOWNLOAD_BASE="file://$PWD/build" PASTY_INSTALL_DIR="$DEST" PASTY_NO_LAUNCH=1
          scripts/install.sh | tee install-1.log
          grep -q "Installing Pasty" install-1.log
          codesign --verify --deep --strict "$DEST/Pasty.app"
          scripts/install.sh | tee install-2.log
          grep -q "Updating Pasty" install-2.log
          test -x "$DEST/Pasty.app/Contents/MacOS/Pasty"
      - name: Signing pipeline self-test (throwaway certificate)
        run: |
          WORK="$(mktemp -d)"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=ext\nprompt=no\n[dn]\nCN=Pasty CI Test\n[ext]\nbasicConstraints=critical,CA:false\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > "$WORK/cert.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout "$WORK/key.pem" -out "$WORK/cert.pem" -config "$WORK/cert.cnf" 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey "$WORK/key.pem" -in "$WORK/cert.pem" -name "Pasty CI Test" -out "$WORK/id.p12" -passout pass:test
          export GITHUB_ENV="$WORK/env" MACOS_SIGNING_P12="$(base64 -i "$WORK/id.p12")" MACOS_SIGNING_PASSWORD=test
          scripts/import-signing-identity.sh
          source "$WORK/env"
          cp -R build/Release/Pasty.app "$WORK/Pasty.app"
          codesign --force --deep --options runtime --timestamp=none --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$WORK/Pasty.app"
          codesign --verify --deep --strict "$WORK/Pasty.app"
          codesign -d -r- "$WORK/Pasty.app" 2>&1 | tee "$WORK/req.txt"
          grep -q 'certificate leaf' "$WORK/req.txt"
          security delete-keychain "$SIGN_KEYCHAIN"
      - name: Crash report (on failure)
        if: failure()
        run: |
          REPORT=$(ls -t ~/Library/Logs/DiagnosticReports/Pasty* 2>/dev/null | head -1 || true)
          if [[ -n "$REPORT" ]]; then
            python3 - "$REPORT" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          report = json.loads(body)
          print(json.dumps(report.get("exception"), indent=1), report.get("termination", {}).get("indicator"))
          crashed = report["threads"][report.get("faultingThread", 0)]
          images = report.get("usedImages", [])
          for frame in crashed["frames"][:25]:
              image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex") is not None else "?"
              print(image, frame.get("symbol", "?"), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          PY
          else
            echo "No crash report found"
          fi
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Pasty-app
          path: |
            build/Pasty.zip
            build/Pasty.zip.sha256
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: build/smoke/

  release:
    name: Publish GitHub release
    needs: [core-tests, app]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pasty-app
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          cd dist
          sha256sum -c Pasty.zip.sha256
          {
            echo "Automatic build of ${GITHUB_SHA::7}. Installed copies update themselves in the background."
            echo
            echo "**Install or update** (paste into Terminal):"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash"
            echo '```'
            echo
            echo "Or download **Pasty.zip** below, unzip it, and drag Pasty.app into Applications. Requires macOS 14+ (Apple Silicon or Intel)."
          } > notes.md
          gh release create "$TAG" Pasty.zip Pasty.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pasty ${TAG#v}" --notes-file notes.md --latest
